<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>THE ULTIMATE BATTLE</title>
<style>
  html,body{margin:0;height:100%;background:#07070f;color:#fff;font-family:"Courier New",monospace;overflow:hidden}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;gap:22px}
  h1{font-size:clamp(22px,7vw,44px);letter-spacing:3px;margin:0;line-height:1.2;text-shadow:3px 3px 0 #9b1fff,-3px -3px 0 #1ec8ff}
  .sub{color:#ffb547;font-size:clamp(13px,4vw,18px);letter-spacing:2px}
  .blink{font-size:clamp(18px,5.5vw,28px);color:#fff;animation:b 1s steps(1) infinite}
  @keyframes b{50%{opacity:0}}
  .bar{width:min(80vw,420px);height:18px;border:3px solid #fff;padding:2px;box-sizing:border-box}
  .fill{height:100%;width:8%;background:#1ec8ff;animation:l 6s ease-in-out infinite alternate}
  @keyframes l{to{width:92%;background:#9b1fff}}
  .small{color:#8a8aa8;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>THE ULTIMATE BATTLE</h1>
  <div class="sub">HALLOWEEN 2026 EDITION</div>
  <div class="bar"><div class="fill"></div></div>
  <div class="blink">INSERT COIN</div>
  <div class="small">LOADING NEXT LEVEL&hellip;</div>
</div>
</body>
</html>
