<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07070f">
<title>THE ULTIMATE BATTLE – Halloween 2026 Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;image-rendering:auto;touch-action:none}
  #rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#07070f;color:#fff;font-family:"Press Start 2P",monospace;text-align:center;z-index:10;padding:24px;box-sizing:border-box}
  #rotate .phone{width:60px;height:100px;border:4px solid #1ec8ff;border-radius:10px;animation:rot 1.6s ease-in-out infinite}
  #rotate p{font-size:14px;line-height:1.8;margin:0}
  #rotate small{font-size:9px;color:#8a8aa8;line-height:1.8}
  @keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="rotate"><div class="phone"></div><p>ROTATE YOUR PHONE</p><small>THE ULTIMATE BATTLE<br>is played in landscape</small></div>
<script src="game.js"></script>
</body>
</html>
